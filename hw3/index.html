<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FreshFirst · HW3</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><a href="../">← homework</a><span>洪英佩 · 111211147</span></header>
  <main>
    <section class="title"><div><p>HW3 · Useful software</p><h1>FreshFirst</h1><p class="lead">Keep a simple pantry. Eat what expires first.</p></div><button id="exportBtn" class="outline">Export list</button></section>
    <section class="workspace">
      <form id="itemForm">
        <h2>Add pantry item</h2>
        <label>Item<input id="itemName" maxlength="40" required placeholder="e.g. Greek yogurt"></label>
        <div class="pair"><label>Quantity<input id="quantity" type="number" min="1" max="99" value="1" required></label><label>Category<select id="category"><option>Fridge</option><option>Freezer</option><option>Produce</option><option>Dry goods</option></select></label></div>
        <label>Best before<input id="expiry" type="date" required></label>
        <button type="submit">Add item</button>
      </form>
      <div class="inventory">
        <div class="toolbar"><div><h2>What to use next</h2><p id="summary"></p></div><select id="filter" aria-label="Filter category"><option value="All">All locations</option><option>Fridge</option><option>Freezer</option><option>Produce</option><option>Dry goods</option></select></div>
        <div id="items"></div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
